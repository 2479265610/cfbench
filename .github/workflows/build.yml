name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "SDK root: $SDK"
          ls "$SDK" || true

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "sdkmanager missing, installing command line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL --retry 3 -o /tmp/ct.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d /tmp/ct
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "Android SDK ready"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fetch Xray core (arm64)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --retry 3 --max-time 180 -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm64-v8a.zip
          unzip -o /tmp/xray.zip xray -d /tmp/xraycore
          mv /tmp/xraycore/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          ls -l app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libxray.so
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so && echo "core size OK"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cfbench-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
